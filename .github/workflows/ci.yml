name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: church_saas_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure test database
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=church_saas_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      # §45: tenant isolation is the one test class that must never be
      # allowed to silently stop running — fails the whole build loudly,
      # separately from the rest of the suite, if it's missing or empty.
      - name: Verify tenant isolation tests exist and are not empty
        run: |
          test -f tests/Feature/TenantIsolationTest.php
          grep -q "public function test_" tests/Feature/TenantIsolationTest.php

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test --parallel

      - name: Lint (Pint, if present)
        run: vendor/bin/pint --test || true
