# Development/reference compose file — not a production deployment
# manifest by itself (see DEPLOYMENT.md for what changes for real
# production use: managed DB instead of a db container, secrets from a
# vault instead of .env, horizontal scaling of app/worker, etc.)

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    depends_on: [db, redis]
    volumes:
      - ./storage:/var/www/html/storage

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on: [app]

  # Same image as `app`, different process (§24: queued jobs — SMS
  # campaigns, announcement emails, the subvention-decision listener —
  # need a real worker running, not just the `sync` driver).
  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan queue:work --tries=3 --max-time=3600
    env_file: .env
    depends_on: [db, redis]
    restart: unless-stopped

  # Same image again — runs the scheduler loop that fires
  # subscriptions:process-billing-cycle and backup:database (see
  # routes/console.php).
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan schedule:work
    env_file: .env
    depends_on: [db, redis]
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: church_saas
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-in-env}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
