; PHP settings this application depends on, for CGI/FPM SAPIs (Herd, php-cgi).
;
; NOTE: "php artisan serve" does NOT read this file - its built-in server is a
; CLI SAPI and only reads php.ini. The serve-specific fix lives in
; app/Console/Kernel-independent code, see SESSION-HANDOFF.md §1t.

; --- Upload limits -----------------------------------------------------------
; PHP's default is upload_max_filesize = 2M. A file above that limit never
; reaches Laravel at all: PHP discards it and passes on a zero-byte upload
; flagged UPLOAD_ERR_INI_SIZE, which surfaces as the unhelpful
; "The photo failed to upload." with no hint that the file was too big for the
; server rather than broken.
;
; post_max_size is raised alongside it: it caps the whole multipart POST body,
; so if it stays at the default a multi-megabyte photo would reject the entire
; request, including the other fields, and not just the file.
upload_max_filesize = 5M
post_max_size = 8M
max_file_uploads = 20

; --- Upload temporary directory ----------------------------------------------
; PHP writes every upload to a temp file BEFORE Laravel runs. On Windows,
; sys_get_temp_dir() falls back to C:\Windows when the process has no TEMP/TMP
; variable - and C:\Windows is not writable - so EVERY upload failed with
; UPLOAD_ERR_NO_TMP_DIR ("unable to create a temporary file"), whatever its
; size. A relative path here is resolved against this file's directory, so it
; always points at a folder this application can write to.
upload_tmp_dir = ../storage/app/upload-tmp

; That folder must exist; it is also created and checked by
; config/filesystems.php's "upload_tmp" entry at boot.
